name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Ruff
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run python -m pytest -m "not online and not private and not differential and not epubcheck"

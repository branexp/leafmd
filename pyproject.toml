[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leafmd"
version = "0.1.0"
description = "Compile EPUB 2/3 books into canonical Markdown book directories"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Brandon Pettee" }]
keywords = ["epub", "markdown", "ebook", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]
dependencies = [
  "EbookLib>=0.20",
  "lxml>=5.2",
  "markdownify>=0.13",
  "typer>=0.12.3",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4.0",
  "mypy>=1.10",
  "types-lxml>=2024.12.13",
]

[project.scripts]
leafmd = "leafmd.cli:app"

[project.urls]
Repository = "https://github.com/branexp/leafmd"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["leafmd"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["leafmd"]
mypy_path = "src"
pretty = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "ebooklib",
  "ebooklib.*",
  "markdownify",
  "bs4",
  "lxml",
  "lxml.*",
]
ignore_missing_imports = true
